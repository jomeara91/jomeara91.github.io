enPage(id){document.getElementById('home').style.display='none';let p=document.getElementById('pages');let d=data[id];p.innerHTML=`<section class="page active"><div class="top"><button class="back" onclick="home()">←</button><div><small>SEhub</small><h3 style="margin:2px 0">${d[0]}</h3></div></div><div class="placeholder"><div class="icon ${d[2]}">${d[1]}</div><h2>${d[0]}</h2><p>This is the placeholder page for ${d[0]}. The full tool can be added here later.</p><b>Coming soon</b></div></section>`}function home(){document.getElementById('pages').innerHTML='';document.getElementById('home').style.display='block'}</script></body></html>
