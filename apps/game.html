<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Multiplier Mayhem Mobile</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040712;font-family:system-ui,sans-serif;color:#fff}canvas{display:block;width:100vw;height:100vh;touch-action:none}.hud{position:fixed;z-index:5;inset:8px 8px auto;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}.pill{background:#07101dcc;border:1px solid #55def677;border-radius:11px;padding:7px 10px;font-size:13px;font-weight:800}.overlay{position:fixed;z-index:30;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#174e85aa,#02050def)}.overlay.hide{display:none}.card{width:min(520px,calc(100% - 28px));padding:26px;text-align:center;background:#07101eee;border:1px solid #55def677;border-radius:22px}.card h1{font-size:clamp(35px,10vw,65px);line-height:.9;margin:0;background:linear-gradient(90deg,#66e3ff,#9b7bff,#ff5da2);color:transparent;background-clip:text}.card p{color:#c8d6ed;line-height:1.45}.card button{padding:13px 24px;border:0;border-radius:13px;font-size:18px;font-weight:900;background:linear-gradient(90deg,#55def6,#84f6b9);color:#06101d}.touch{position:fixed;z-index:15;inset:0;display:none;pointer-events:none}.touch-mode .touch{display:block}.joy{position:absolute;left:18px;bottom:max(20px,env(safe-area-inset-bottom));width:126px;height:126px;border-radius:50%;background:#14234188;border:2px solid #69d6ff88;pointer-events:auto;touch-action:none}.knob{position:absolute;left:35px;top:35px;width:56px;height:56px;border-radius:50%;background:#64e7ffdd;border:2px solid #fff;box-shadow:0 0 22px #30cfff}.pulse{position:absolute;right:18px;bottom:max(28px,env(safe-area-inset-bottom));width:90px;height:90px;border-radius:50%;border:3px solid #ffffffbb;background:radial-gradient(circle,#c5a7ff,#6f3ed6);color:#fff;font-weight:900;pointer-events:auto;touch-action:none}.pulse:disabled{opacity:.4}.weps{position:absolute;right:12px;top:82px;display:grid;grid-template-columns:repeat(2,50px);gap:6px;pointer-events:auto}.weps button{height:43px;border-radius:10px;border:1px solid #69d6ff77;background:#07101ddd;color:#d9f6ff;font-size:10px;font-weight:800;touch-action:none}.weps button.on{background:#55def6;color:#06101d}.msg{position:fixed;z-index:10;top:20%;left:50%;transform:translate(-50%,-50%);font-size:clamp(24px,7vw,50px);font-weight:950;text-align:center;text-shadow:0 4px 18px #000;opacity:0;transition:.15s;pointer-events:none}@media(max-height:540px){.joy{width:104px;height:104px}.knob{left:29px;top:29px;width:46px;height:46px}.pulse{width:72px;height:72px}.weps{top:62px}}
</style></head><body><canvas id="c"></canvas><div class="hud"><div class="pill">Score <span id="score">0</span></div><div class="pill">Weapon <span id="weapon">Blaster</span> · ×<span id="power">1</span></div><div class="pill">Lives <span id="lives">3</span></div><div class="pill">Pulse <span id="pulseState">Locked</span></div></div><div id="msg" class="msg"></div><div class="touch"><div id="joy" class="joy"><div id="knob" class="knob"></div></div><div class="weps"><button data-w="0">BLAST</button><button data-w="1">SPREAD</button><button data-w="2">RAPID</button><button data-w="3">HEAVY</button></div><button id="pulseBtn" class="pulse" disabled>LOCKED</button></div><div id="overlay" class="overlay"><div class="card"><h1>MULTIPLIER<br>MAYHEM</h1><p id="help"></p><button id="start">START GAME</button></div></div><script>
(()=>{'use strict';const c=document.querySelector('#c'),x=c.getContext('2d'),$=s=>document.querySelector(s),scoreE=$('#score'),powerE=$('#power'),livesE=$('#lives'),weaponE=$('#weapon'),pulseE=$('#pulseState'),overlay=$('#overlay'),msg=$('#msg'),pulseBtn=$('#pulseBtn'),joy=$('#joy'),knob=$('#knob'),wBtns=[...document.querySelectorAll('[data-w]')];let W,H,D,running=false,last=0,score=0,power=1,lives=3,wi=0,shot=0,spawn=0,reward=0,temp=null,tempT=0,pulseLock=false,pulseCD=0,pulseWave=0,shake=0;const touch=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0||innerWidth<760;document.body.classList.toggle('touch-mode',touch);$('#help').textContent=touch?'Use the joystick to move. Tap the weapon buttons to switch and use PULSE once unlocked. Shooting is automatic.':'Move with Arrow Keys or WASD. Press 1–4 to switch weapons and Space for the Pulse. Shooting is automatic.';const keys=new Set(),move={x:0,y:0},P={x:0,y:0,r:18,inv:0},bul=[],en=[],items=[],parts=[],stars=[];const weapons=[{n:'Blaster',rate:.25,s:660,d:1,c:'#55e1ff',style:0},{n:'Spread',rate:.34,s:610,d:1,c:'#84f6b9',style:1},{n:'Rapid',rate:.095,s:760,d:1,c:'#ffe066',style:0},{n:'Heavy',rate:.52,s:520,d:3,c:'#ff9f68',style:2}];
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);P.x=P.x||W/2;P.y=Math.min(P.y||H-90,H-35);if(!stars.length)for(let i=0;i<120;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+1,v:20+Math.random()*40})}addEventListener('resize',resize);resize();
function hud(){scoreE.textContent=score;powerE.textContent=power;livesE.textContent=lives;weaponE.textContent=temp?temp.n+' '+tempT.toFixed(1)+'s':weapons[wi].n;pulseE.textContent=!pulseLock?'Locked':pulseCD?' '+pulseCD.toFixed(1)+'s':'READY';pulseBtn.disabled=!pulseLock||pulseCD>0;pulseBtn.textContent=!pulseLock?'LOCKED':pulseCD?Math.ceil(pulseCD)+'s':'PULSE';wBtns.forEach((b,i)=>b.classList.toggle('on',i===wi&&!temp))}function flash(t,col='#fff'){msg.textContent=t;msg.style.color=col;msg.style.opacity=1;clearTimeout(flash.t);flash.t=setTimeout(()=>msg.style.opacity=0,700)}function reset(){score=0;power=1;lives=3;wi=0;temp=null;tempT=0;pulseLock=false;pulseCD=0;pulseWave=0;shot=spawn=reward=0;bul.length=en.length=items.length=parts.length=0;P.x=W/2;P.y=H-90;P.inv=0;hud()}function start(){reset();overlay.classList.add('hide');running=true;last=performance.now();requestAnimationFrame(loop)}$('#start').onclick=start;
addEventListener('keydown',e=>{keys.add(e.code);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(/^Digit[1-4]$/.test(e.code)&&!temp){wi=+e.code.at(-1)-1;hud()}if(e.code==='Space')pulse()});addEventListener('keyup',e=>keys.delete(e.code));let jid=null;function joySet(e){const r=joy.getBoundingClientRect(),mx=r.width*.34;let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy)||1;if(l>mx){dx*=mx/l;dy*=mx/l}move.x=dx/mx;move.y=dy/mx;knob.style.transform=`translate(${dx}px,${dy}px)`}joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);joySet(e)};joy.onpointermove=e=>{if(e.pointerId===jid)joySet(e)};function jup(e){if(e.pointerId!==jid)return;jid=null;move.x=move.y=0;knob.style.transform=''}joy.onpointerup=jup;joy.onpointercancel=jup;pulseBtn.onpointerdown=e=>{e.preventDefault();pulse()};wBtns.forEach(b=>b.onpointerdown=e=>{e.preventDefault();if(!temp){wi=+b.dataset.w;hud()}});
function burst(px,py,col,n=12){for(let i=0;i<n;i++){let a=Math.random()*7,s=40+Math.random()*170;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.4+Math.random()*.5,c:col})}}function fire(){if(temp?.type==='laser')return;if(temp?.type==='missile'){let n=Math.min(10,Math.max(1,Math.ceil(power/3)));for(let i=0;i<n;i++)bul.push({x:P.x+(i-(n-1)/2)*10,y:P.y-20,vx:0,vy:-350,r:7,d:4,c:'#ffb347',home:1});return}let w=weapons[wi],base=Math.min(power,24),n=w.style===1?Math.min(30,Math.max(3,base+2)):base,spread=w.style===1?.62:Math.min(.5,(n-1)*.055);for(let i=0;i<n;i++){let t=n===1?0:i/(n-1)-.5;bul.push({x:P.x,y:P.y-20,vx:t*spread*w.s,vy:-w.s,r:w.style===2?7:4,d:w.d,c:w.c})}}function spawnEnemy(){let r=15+Math.random()*13,hp=Math.max(1,Math.ceil(score/500+Math.random()*2));en.push({x:r+Math.random()*(W-r*2),y:-r,r,vy:95+Math.random()*70+score*.015,hp,max:hp,zig:Math.random()<.15,ph:Math.random()*7})}function spawnItem(){let roll=Math.random(),type=roll<.17?'laser':roll<.34?'missile':roll<.82?'mul':'div';items.push({x:55+Math.random()*(W-110),y:-45,w:type==='missile'?102:80,h:44,vy:105,type,val:type==='mul'?(Math.random()<.25?3:2):2})}function pulse(){if(!running||!pulseLock||pulseCD>0)return;pulseCD=12;pulseWave=1;let set=new Set;en.forEach((e,i)=>{if(Math.hypot(e.x-P.x,e.y-P.y)<220)set.add(i)});let change=1;while(change){change=0;en.forEach((e,i)=>{if(set.has(i))return;for(const j of set)if(Math.hypot(e.x-en[j].x,e.y-en[j].y)<105){set.add(i);change=1;break}})}let n=0;for(let i=en.length-1;i>=0;i--)if(set.has(i)){burst(en[i].x,en[i].y,'#c5a7ff',18);en.splice(i,1);score+=15;n++}shake=18;flash('ENERGY PULSE · '+n,'#c5a7ff');hud()}
function update(dt){stars.forEach(s=>{s.y+=s.v*dt;if(s.y>H)s.y=0});let dx=(keys.has('ArrowRight')||keys.has('KeyD'))-(keys.has('ArrowLeft')||keys.has('KeyA'))+move.x,dy=(keys.has('ArrowDown')||keys.has('KeyS'))-(keys.has('ArrowUp')||keys.has('KeyW'))+move.y;dx=Math.max(-1,Math.min(1,dx));dy=Math.max(-1,Math.min(1,dy));if(dx&&dy){dx*=.707;dy*=.707}P.x=Math.max(20,Math.min(W-20,P.x+dx*360*dt));P.y=Math.max(H*.32,Math.min(H-30,P.y+dy*360*dt));P.inv=Math.max(0,P.inv-dt);shot-=dt;if(shot<=0){fire();shot=Math.max(.065,(temp?.type==='missile'?.42:weapons[wi].rate)-power*.008)}spawn-=dt;if(spawn<=0){spawnEnemy();spawn=Math.max(.22,.8-score*.00012)}reward-=dt;if(reward<=0){spawnItem();reward=4.2+Math.random()*3}if(temp){tempT-=dt;if(tempT<=0){let n=temp.n;temp=null;tempT=0;flash(n+' ended')}hud()}if(score>=100&&!pulseLock){pulseLock=true;flash('PULSE UNLOCKED','#c5a7ff');hud()}if(pulseCD){pulseCD=Math.max(0,pulseCD-dt);hud()}pulseWave=Math.max(0,pulseWave-dt*1.7);bul.forEach(b=>{if(b.home&&en.length){let q=en.reduce((a,e)=>Math.hypot(e.x-b.x,e.y-b.y)<Math.hypot(a.x-b.x,a.y-b.y)?e:a),a=Math.atan2(q.y-b.y,q.x-b.x);b.vx+=(Math.cos(a)*430-b.vx)*Math.min(1,dt*5);b.vy+=(Math.sin(a)*430-b.vy)*Math.min(1,dt*5)}b.x+=b.vx*dt;b.y+=b.vy*dt});items.forEach(i=>i.y+=i.vy*dt);en.forEach(e=>{let d=P.x-e.x,st=e.zig?145:115;e.x+=Math.max(-st,Math.min(st,d*1.45))*dt+(e.zig?Math.sin(e.y*.025+e.ph)*35*dt:0);e.x=Math.max(e.r,Math.min(W-e.r,e.x));e.y+=e.vy*dt;if(e.y-e.r>H)e.y=-e.r-10});if(temp?.type==='laser')for(let i=en.length-1;i>=0;i--){let e=en[i];if(Math.abs(e.x-P.x)<20&&e.y<P.y){e.hp-=12*dt;if(e.hp<=0){score+=10*e.max;burst(e.x,e.y,'#60f6ff',18);en.splice(i,1);hud()}}}for(let i=bul.length-1;i>=0;i--){let b=bul[i];if(b.y<-30||b.x<-30||b.x>W+30){bul.splice(i,1);continue}for(let j=en.length-1;j>=0;j--){let e=en[j];if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r*1.28){bul.splice(i,1);e.hp-=b.d;if(e.hp<=0){score+=10*e.max;burst(e.x,e.y,'#ff5577',15);en.splice(j,1);hud()}break}}}for(let i=items.length-1;i>=0;i--){let q=items[i];if(Math.abs(P.x-q.x)<q.w/2+P.r&&Math.abs(P.y-q.y)<q.h/2+P.r){if(q.type==='laser'||q.type==='missile'){temp={type:q.type,n:q.type==='laser'?'Laser Beam':'Homing Missiles'};tempT=10;flash(temp.n+' · 10s',q.type==='laser'?'#60f6ff':'#ffb347')}else if(q.type==='mul'){power=Math.min(64,power*q.val);flash('POWER ×'+q.val,'#68ffb0')}else{power=Math.max(1,Math.ceil(power/q.val));flash('POWER ÷'+q.val,'#ff758f')}items.splice(i,1);hud()}else if(q.y>H+60)items.splice(i,1)}for(let i=en.length-1;i>=0;i--){let e=en[i];if(P.inv<=0&&Math.hypot(P.x-e.x,P.y-e.y)<P.r+e.r*.7){en.splice(i,1);lives--;P.inv=1.2;shake=12;hud();if(lives<=0){running=false;overlay.classList.remove('hide');$('.card h1').innerHTML='GAME<br>OVER';$('.card p').textContent='Final score: '+score;$('#start').textContent='PLAY AGAIN'}}}parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt});for(let i=parts.length-1;i>=0;i--)if(parts[i].t<=0)parts.splice(i,1);shake*=Math.pow(.03,dt)}
function draw(){x.clearRect(0,0,W,H);x.save();x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07152d');g.addColorStop(1,'#06070f');x.fillStyle=g;x.fillRect(-20,-20,W+40,H+40);x.fillStyle='#d9f6ff';stars.forEach(s=>x.fillRect(s.x,s.y,s.s,s.s));items.forEach(q=>{let col=q.type==='mul'?'#57f2a3':q.type==='div'?'#ff5d79':q.type==='laser'?'#60f6ff':'#ffb347',label=q.type==='mul'?'×'+q.val:q.type==='div'?'÷'+q.val:q.type==='laser'?'LASER':'MISSILES';x.fillStyle=col+'22';x.strokeStyle=col;x.lineWidth=3;x.beginPath();x.roundRect(q.x-q.w/2,q.y-q.h/2,q.w,q.h,11);x.fill();x.stroke();x.fillStyle=col;x.font='900 14px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(label,q.x,q.y)});bul.forEach(b=>{x.fillStyle=b.c;x.shadowBlur=14;x.shadowColor=b.c;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()});x.shadowBlur=0;if(temp?.type==='laser'){x.fillStyle='#bfffffdd';x.shadowBlur=25;x.shadowColor='#60f6ff';x.fillRect(P.x-19,0,38,P.y-22);x.shadowBlur=0}en.forEach(e=>{x.fillStyle='#ff486f';x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill();x.fillStyle='#240511';x.beginPath();x.arc(e.x-e.r*.28,e.y-2,3,0,7);x.arc(e.x+e.r*.28,e.y-2,3,0,7);x.fill()});if(pulseWave){x.strokeStyle='#c5a7ff';x.lineWidth=10;x.beginPath();x.arc(P.x,P.y,220*(1-pulseWave)+20,0,7);x.stroke()}if(P.inv<=0||Math.floor(P.inv*12)%2===0){x.fillStyle='#64e7ff';x.beginPath();x.arc(P.x,P.y-14,9,0,7);x.fill();x.fillRect(P.x-9,P.y-5,18,25)}parts.forEach(p=>{x.globalAlpha=Math.max(0,p.t);x.fillStyle=p.c;x.fillRect(p.x,p.y,4,4)});x.globalAlpha=1;x.restore()}function loop(t){if(!running)return;let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}draw();hud()})();
</script></body></html>
